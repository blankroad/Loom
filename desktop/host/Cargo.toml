[package]
name = "loom-desktop-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "Loom Desktop daemon lifecycle: reuse or start loomd, mint a fresh viewer bootstrap URL. No Tauri dependency."

# No [workspace] table: this crate is a member of the desktop workspace (desktop/Cargo.toml).

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
