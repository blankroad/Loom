[package]
name = "opus-cli-rtt"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tungstenite = "0.26"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
strip = true
