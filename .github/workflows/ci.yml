name: Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Rust 1.93 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 의존성 준비
        run: cargo fetch --locked
      - name: 서식
        run: cargo fmt --all --check
      - name: 정적 검사
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace 시험
        run: cargo test --workspace
      - name: Schema drift
        run: cargo run -p loom-schema -- check
      - name: 의존 경계
        run: cargo test -p loom-xtask
