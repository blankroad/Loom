[package]
name = "loom-cli"
description = "The `loom` CLI: synchronous daemon client, autostart, core commands and domain CLI fragments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-proto.workspace = true
loom-cli-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tungstenite.workspace = true
# Domain CLI fragments only (I1): path dependency so `default-features = false` takes effect.
loom-echo = { path = "../loom-echo", default-features = false, features = ["cli"], optional = true }
loom-uart = { path = "../loom-uart", default-features = false, features = ["cli"], optional = true }
loom-can = { path = "../loom-can", default-features = false, features = ["cli"], optional = true }
loom-eth = { path = "../loom-eth", default-features = false, features = ["cli"], optional = true }
loom-psu = { path = "../loom-psu", default-features = false, features = ["cli"], optional = true }

loom-uds = { path = "../loom-uds", default-features = false, features = ["cli"], optional = true }
loom-test = { path = "../loom-test", default-features = false, features = ["cli"], optional = true }

[features]
default = ["echo", "uart", "can", "uds", "eth", "psu", "test"]
echo = ["dep:loom-echo"]
uart = ["dep:loom-uart"]
can = ["dep:loom-can"]
eth = ["dep:loom-eth"]
psu = ["dep:loom-psu"]
uds = ["dep:loom-uds"]
test = ["dep:loom-test"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
