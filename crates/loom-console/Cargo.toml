[package]
name = "loom-console"
description = "Shared console engine (A4): fixed ring, cursors, text pipeline, render sanitizer (own state machine), bounded matcher, InputArbiter. No device I/O, no async runtime; builds for wasm32 (sanitizer)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["matcher"]
# Bounded expect matcher (memchr literal + regex). Off for the WASM sanitizer build.
matcher = ["dep:regex"]

[dependencies]
loom-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr = { version = "=2.8.3", default-features = false, features = ["alloc"] }
regex = { version = "=1.13.1", optional = true }

[dev-dependencies]
proptest = "=1.12.0"

[lints]
workspace = true
