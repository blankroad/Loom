[package]
name = "loom-logic"
description = "Loom logic domain: logic-analyzer capture through an external sigrok-cli process (raw edges + libsigrok decoder annotations)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
loom-proto.workspace = true
serde_json.workspace = true
loom-domain-api = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
loom-worker-sdk = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
loom-cli-kit = { workspace = true, optional = true }
clap = { workspace = true, optional = true }

# The `loom` CLI links only `cli` (invariant I1: no gateway/worker code in the CLI binary).
[features]
default = ["gateway", "worker", "cli"]
gateway = ["dep:loom-domain-api", "dep:schemars"]
worker = ["dep:loom-worker-sdk", "dep:tokio"]
cli = ["dep:loom-cli-kit", "dep:clap"]

[dev-dependencies]
loom-testkit.workspace = true

[lints]
workspace = true
