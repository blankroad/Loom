[package]
name = "loom-can"
description = "Loom CAN domain: gateway module (registration, hooks, queries), can-sim worker and `loom can` CLI fragment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
loom-proto.workspace = true
loom-domain-api.workspace = true
loom-worker-sdk.workspace = true
loom-cli-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
clap.workspace = true
thiserror.workspace = true
loom-can-frame = { path = "../loom-can-frame" }
loom-can-sim = { path = "../loom-can-sim" }
loom-can-dbc = { path = "../loom-can-dbc" }
loom-can-isotp = { path = "../loom-can-isotp" }
loom-can-periodic = { path = "../loom-can-periodic" }
# UDS virtual ECU as an ISO-TP server model (sim only).
loom-uds-sim = { path = "../loom-uds-sim", optional = true }

[features]
default = ["uds-sim"]
uds-sim = ["dep:loom-uds-sim"]

[dev-dependencies]
loom-testkit.workspace = true

[lints]
workspace = true
