[package]
name = "loom-uart"
description = "UART domain: gateway piece (commands, event kinds, risk table, hooks, mirror, help), worker piece (re-export of loom-uart-worker) and CLI piece, as features like loom-echo."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["gateway", "worker", "cli"]
# Runs inside loomd: registration, hooks, mirror, help.
gateway = ["dep:loom-domain-api", "dep:schemars", "dep:regex", "dep:hex"]
# The device owner (`loomd worker uart`). The `loom` CLI must never enable this (invariant I1).
worker = ["dep:loom-uart-worker"]
# `loom uart …` argument parsing and human rendering.
cli = ["dep:loom-cli-kit", "dep:clap", "dep:hex"]

[dependencies]
loom-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
loom-domain-api = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
regex = { version = "=1.13.1", optional = true }
loom-cli-kit = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
loom-uart-worker = { path = "../loom-uart-worker", optional = true }

[dev-dependencies]
proptest = "=1.12.0"
hex.workspace = true
loom-testkit.workspace = true

[lints]
workspace = true
