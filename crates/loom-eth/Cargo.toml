[package]
name = "loom-eth"
description = "Loom eth domain: gateway (registration, queries, hooks), worker (capture pipeline) and CLI (tshark-style) pieces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
loom-proto.workspace = true
loom-domain-api.workspace = true
loom-worker-sdk = { workspace = true, optional = true }
loom-cli-kit = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
clap = { workspace = true, optional = true }
base64.workspace = true
loom-eth-decode = { path = "../loom-eth-decode", optional = true }
loom-eth-filter = { path = "../loom-eth-filter", optional = true }
loom-eth-pcapng = { path = "../loom-eth-pcapng", optional = true }
loom-eth-capture = { path = "../loom-eth-capture", optional = true }

[features]
default = ["runtime", "cli"]
cli = ["dep:loom-cli-kit", "dep:clap"]
runtime = ["dep:loom-worker-sdk", "dep:loom-eth-decode", "dep:loom-eth-filter", "dep:loom-eth-pcapng", "dep:loom-eth-capture"]

live = ["runtime", "loom-eth-capture/live"]

[dev-dependencies]
loom-testkit.workspace = true

[lints]
workspace = true
